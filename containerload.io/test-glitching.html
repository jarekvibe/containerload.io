<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ContainerLoad - Glitching-Bug Test</title>
<style>
  body { font-family: monospace; background: #070a0f; color: #eef2f7; padding: 20px; }
  .test { margin: 20px 0; padding: 15px; border: 1px solid #34435a; border-radius: 4px; }
  .test h3 { margin: 0 0 10px 0; }
  .passed { border-left: 4px solid #10b981; background: rgba(16, 185, 129, 0.1); }
  .failed { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.1); }
  .error { color: #ef4444; font-weight: bold; }
  .info { color: #60a5fa; }
  .data { background: #0f1419; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 11px; overflow-x: auto; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<h1>Glitching-Bug Test Suite</h1>
<div id="results"></div>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Vereinfachte Test-Version: nur die relevanten Funktionen aus app.html
const SUPPORT_MIN = 0.7;
const num = (x) => {
  const n = parseFloat(x);
  return isFinite(n) ? n : 0;
};

function emsOverlap(S, B) {
  return S.x < B.x + B.dx && B.x < S.x + S.dx &&
         S.y < B.y + B.dy && B.y < S.y + S.dy &&
         S.z < B.z + B.dz && B.z < S.z + S.dz;
}

function emsSplit(S, B) {
  const r = [];
  if (B.x > S.x) r.push({ x: S.x, y: S.y, z: S.z, dx: B.x - S.x, dy: S.dy, dz: S.dz });
  if (B.x + B.dx < S.x + S.dx) r.push({ x: B.x + B.dx, y: S.y, z: S.z, dx: S.x + S.dx - B.x - B.dx, dy: S.dy, dz: S.dz });
  if (B.y > S.y) r.push({ x: S.x, y: S.y, z: S.z, dx: S.dx, dy: B.y - S.y, dz: S.dz });
  if (B.y + B.dy < S.y + S.dy) r.push({ x: S.x, y: B.y + B.dy, z: S.z, dx: S.dx, dy: S.y + S.dy - B.y - B.dy, dz: S.dz });
  if (B.z > S.z) r.push({ x: S.x, y: S.y, z: S.z, dx: S.dx, dy: S.dy, dz: B.z - S.z });
  if (B.z + B.dz < S.z + S.dz) r.push({ x: S.x, y: S.y, z: B.z + B.dz, dx: S.dx, dy: S.dy, dz: S.z + S.dz - B.z - B.dz });
  return r;
}

function emsContains(a, b) {
  return a.x <= b.x + 1e-6 && a.y <= b.y + 1e-6 && a.z <= b.z + 1e-6 &&
         a.x + a.dx >= b.x + b.dx - 1e-6 && a.y + a.dy >= b.y + b.dy - 1e-6 && a.z + a.dz >= b.z + b.dz - 1e-6;
}

function emsPrune(list) {
  const out = [];
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    if (a.dx < 1e-6 || a.dy < 1e-6 || a.dz < 1e-6) continue;
    let dom = false;
    for (let j = 0; j < list.length; j++) {
      if (i === j) continue;
      const b = list[j];
      if (b.dx < 1e-6) continue;
      if (emsContains(b, a) && !(emsContains(a, b) && j < i)) {
        dom = true;
        break;
      }
    }
    if (!dom) out.push(a);
  }
  return out;
}

function emsOris(it) {
  const o = [], s = new Set();
  const add = (x, y, z) => {
    const k = `${x},${y},${z}`;
    if (!s.has(k)) {
      s.add(k);
      o.push([x, y, z]);
    }
  };
  add(it.l, it.h, it.w);
  if (it.rotatable !== false) add(it.w, it.h, it.l);
  return o;
}

function supportRatio(px, pz, dx, dz, py, placed) {
  if (py <= 1e-4) return 1;
  const base = dx * dz;
  if (base <= 0) return 1;
  let sup = 0;
  for (const b of placed) {
    if (Math.abs(b.y + b.dy - py) > 1e-3) continue;
    const ox = Math.min(px + dx, b.x + b.dx) - Math.max(px, b.x);
    if (ox <= 0) continue;
    const oz = Math.min(pz + dz, b.z + b.dz) - Math.max(pz, b.z);
    if (oz <= 0) continue;
    sup += ox * oz;
    if (sup >= base * 0.999) return 1;
  }
  return sup / base;
}

function emsPackOnce(C2, units, order, pay, cap) {
  let ems = [{ x: 0, y: 0, z: 0, dx: C2.l, dy: C2.h, dz: C2.w }];
  const placed = [];
  let weight = 0;

  for (const u of units) {
    if (weight + u.weight > pay + 1e-6) continue;
    let best = null;

    for (const S of ems) {
      if (u.stackable === false && S.y > 1e-6) continue;

      for (const [dx, dy, dz] of emsOris(u)) {
        if (dx <= S.dx + 1e-6 && dy <= S.dy + 1e-6 && dz <= S.dz + 1e-6) {
          const px = S.x, py = S.y, pz = S.z;
          if (py > 1e-4 && supportRatio(px, pz, dx, dz, py, placed) < SUPPORT_MIN) continue;

          let score;
          if (order === 0) score = py * 1e12 + px * 1e6 + pz;
          else if (order === 1) score = py * 1e12 + pz * 1e6 + px;
          else if (order === 2) score = px * 1e12 + py * 1e6 + pz;
          else score = py * 1e12 + (px + pz) * 1e6 + Math.min(S.dx - dx, S.dz - dz);

          if (!best || score < best.score) best = { px, py, pz, dx, dy, dz, score };
        }
      }
    }

    if (!best) continue;
    const B = { x: best.px, y: best.py, z: best.pz, dx: best.dx, dy: best.dy, dz: best.dz };
    placed.push({ ...B, ti: u.ti });
    weight += u.weight;

    const next = [];
    for (const S of ems) {
      if (emsOverlap(S, B)) {
        for (const ns of emsSplit(S, B)) next.push(ns);
      } else next.push(S);
    }
    ems = emsPrune(next);
    if (ems.length > cap) ems = ems.slice(0, cap);
  }

  return { placed, weight };
}

// Vereinfachte packCargo für Single-Type (ohne makeFloorPacker)
function packCargo(container, types) {
  const CL = num(container.l), CW = num(container.w), CH = num(container.h);
  const pay = num(container.payload) > 0 ? num(container.payload) : Infinity;

  const valid = types.map((t, ti) => ({
    ti, rotatable: t.rotatable !== false, stackable: t.stackable !== false,
    l: num(t.l), w: num(t.w), h: num(t.h),
    qty: Math.max(0, Math.floor(num(t.qty))), weight: num(t.weight)
  })).filter((t) => t.l > 0 && t.w > 0 && t.h > 0 && t.qty > 0);

  if (valid.length === 0) return { placed: [], boxes: 0, errors: [] };

  let units = [];
  valid.forEach((t) => {
    for (let i = 0; i < t.qty; i++) units.push(t);
  });

  if (units.length > 1500) units = units.slice(0, 1500);
  units.sort((a, b) => (a.stackable === false ? 0 : 1) - (b.stackable === false ? 0 : 1) ||
                        b.l * b.w * b.h - a.l * a.w * a.h || b.l - a.l || b.w - a.w || b.h - a.h ||
                        b.weight - a.weight || a.ti - b.ti);

  const cap = units.length > 200 ? 1500 : 3000;
  const res = emsPackOnce({ l: CL, w: CW, h: CH }, units, 0, pay, cap);

  return { placed: res.placed, boxes: res.placed.length, errors: [] };
}

// Funktion zum Prüfen von Overlaps
function checkForOverlaps(placed, container) {
  const errors = [];

  for (let i = 0; i < placed.length; i++) {
    const a = placed[i];

    // Prüfe ob Box außerhalb des Containers ist
    if (a.x < -0.01 || a.y < -0.01 || a.z < -0.01 ||
        a.x + a.dx > container.l + 0.01 ||
        a.y + a.dy > container.h + 0.01 ||
        a.z + a.dz > container.w + 0.01) {
      errors.push({
        type: "OUT_OF_BOUNDS",
        boxIndex: i,
        box: a,
        container
      });
    }

    // Prüfe Overlaps mit anderen Boxen
    for (let j = i + 1; j < placed.length; j++) {
      const b = placed[j];

      const overlap = a.x < b.x + b.dx && b.x < a.x + a.dx &&
                      a.y < b.y + b.dy && b.y < a.y + a.dy &&
                      a.z < b.z + b.dz && b.z < a.z + a.dz;

      if (overlap) {
        const dx = Math.min(a.x + a.dx, b.x + b.dx) - Math.max(a.x, b.x);
        const dy = Math.min(a.y + a.dy, b.y + b.dy) - Math.max(a.y, b.y);
        const dz = Math.min(a.z + a.dz, b.z + b.dz) - Math.max(a.z, b.z);
        const overlapVolume = dx * dy * dz;

        errors.push({
          type: "OVERLAP",
          box1: i,
          box2: j,
          a, b,
          overlapVolume,
          overlapDims: { dx, dy, dz }
        });
      }
    }
  }

  return errors;
}

// Test-Szenarien
const scenarios = [
  {
    name: "Dichte 40' GP mit 40x Europaletten (120x80cm)",
    container: { l: 1203, w: 235, h: 239, payload: 26600 },
    cargo: [{ qty: 40, l: 120, w: 80, h: 150, weight: 20 }]
  },
  {
    name: "Riesige Box (500x200x200) + 100 kleine (10x10x10)",
    container: { l: 1203, w: 235, h: 239, payload: 26600 },
    cargo: [
      { qty: 1, l: 500, w: 200, h: 200, weight: 1000 },
      { qty: 100, l: 10, w: 10, h: 10, weight: 1, stackable: true }
    ]
  },
  {
    name: "Hohe Stapelung - 9x 79.67cm Boxen (sollten 3-lagig passen)",
    container: { l: 590, w: 235, h: 239, payload: 28200 },
    cargo: [{ qty: 9, l: 120, w: 80, h: 79.67, weight: 20 }]
  },
  {
    name: "Grenzkonflikte - 228cm breite Box an 235cm Wand",
    container: { l: 590, w: 235, h: 239, payload: 28200 },
    cargo: [
      { qty: 1, l: 590, w: 228, h: 120, weight: 1000 },
      { qty: 5, l: 120, w: 80, h: 100, weight: 20 }
    ]
  },
  {
    name: "Gemischte Orientierungen (590x235 Boxen)",
    container: { l: 1203, w: 235, h: 239, payload: 26600 },
    cargo: [
      { qty: 3, l: 590, w: 235, h: 50, weight: 100, rotatable: false },
      { qty: 20, l: 100, w: 100, h: 100, weight: 50 }
    ]
  },
  {
    name: "500 kleine Boxen (50x50x50)",
    container: { l: 1203, w: 235, h: 270, payload: 26580 },
    cargo: [{ qty: 500, l: 50, w: 50, h: 50, weight: 10 }]
  },
  {
    name: "Nicht-stapelbare Boxen (10x100x100x100 + 30x50x50x50)",
    container: { l: 1203, w: 235, h: 270, payload: 26580 },
    cargo: [
      { qty: 10, l: 100, w: 100, h: 100, weight: 50, stackable: false },
      { qty: 30, l: 50, w: 50, h: 50, weight: 10, stackable: true }
    ]
  }
];

// Führe alle Tests aus
function runTests() {
  const resultsDiv = document.getElementById("results");
  let totalTests = 0, passedTests = 0;

  for (const scenario of scenarios) {
    totalTests++;
    const result = packCargo(scenario.container, scenario.cargo);
    const errors = checkForOverlaps(result.placed, scenario.container);

    const testDiv = document.createElement("div");
    testDiv.className = `test ${errors.length > 0 ? "failed" : "passed"}`;

    const status = errors.length > 0 ? "FAILED" : "PASSED";
    if (errors.length === 0) passedTests++;

    testDiv.innerHTML = `
      <h3>${status}: ${scenario.name}</h3>
      <p><span class="info">Boxen platziert:</span> ${result.placed.length} / ${scenario.cargo.reduce((s, c) => s + c.qty, 0)}</p>
      <p><span class="info">Container:</span> ${scenario.container.l}x${scenario.container.w}x${scenario.container.h} cm</p>
      ${errors.length > 0 ? `
        <p><span class="error">Fehler gefunden: ${errors.length}</span></p>
        <div class="data">
          ${errors.map((e, idx) => {
            if (e.type === "OVERLAP") {
              return `<div>
                <strong>Overlap #${idx + 1}:</strong> Box ${e.box1} und Box ${e.box2}<br>
                Box ${e.box1}: x=${e.a.x.toFixed(2)}, y=${e.a.y.toFixed(2)}, z=${e.a.z.toFixed(2)}, ${e.a.dx}x${e.a.dy}x${e.a.dz}<br>
                Box ${e.box2}: x=${e.b.x.toFixed(2)}, y=${e.b.y.toFixed(2)}, z=${e.b.z.toFixed(2)}, ${e.b.dx}x${e.b.dy}x${e.b.dz}<br>
                Overlap-Volumen: ${e.overlapVolume.toFixed(1)} cm³, Dims: ${e.overlapDims.dx.toFixed(2)}x${e.overlapDims.dy.toFixed(2)}x${e.overlapDims.dz.toFixed(2)}
              </div>`;
            } else if (e.type === "OUT_OF_BOUNDS") {
              return `<div>
                <strong>Out of Bounds #${idx + 1}:</strong> Box ${e.boxIndex}<br>
                Position: x=${e.box.x.toFixed(2)}, y=${e.box.y.toFixed(2)}, z=${e.box.z.toFixed(2)}<br>
                Größe: ${e.box.dx}x${e.box.dy}x${e.box.dz}, Container: ${e.container.l}x${e.container.w}x${e.container.h}
              </div>`;
            }
          }).join("")}
        </div>
      ` : ""}
    `;

    resultsDiv.appendChild(testDiv);
  }

  const summaryDiv = document.createElement("div");
  summaryDiv.className = "test passed";
  summaryDiv.innerHTML = `<h3>Zusammenfassung</h3><p>Bestanden: ${passedTests}/${totalTests}</p>`;
  resultsDiv.insertBefore(summaryDiv, resultsDiv.firstChild);
}

// Starten wenn das Dokument geladen ist
window.addEventListener("load", runTests);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta property="og:site_name" content="ContainerLoad" />
<meta property="og:image" content="https://containerload.io/share-og.png" />

<meta property="og:image:alt" content="Ein Ladeplan wurde dir geteilt – in 3D ansehen." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="📦 Stauplan wurde mit dir geteilt" />
<meta name="twitter:description" content="Sieh in 3D, wie die Ladung in den Container passt – ohne Login, direkt im Browser." />

<!-- Verweist auf die Markendateien statt das Zeichen hier noch einmal einzubacken.
     Eingebackene Kopien laufen auseinander — genau das war hier passiert. -->
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0e16;color:#eef2f7;font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .bg{position:fixed;inset:0;background:radial-gradient(60% 50% at 80% 0%,rgba(21,64,122,.6),transparent),radial-gradient(50% 40% at 0% 100%,rgba(15,61,58,.5),transparent)}
  .wrap{position:relative;text-align:center;padding:24px;max-width:440px}
  .logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px}
  /* Ein Markenton, kein Verlauf, kein farbiger Schein — wie auf der Startseite und im Rechner. */
  .mark{width:40px;height:40px;border-radius:11px;background:#C8402C;display:flex;align-items:center;justify-content:center}
  .word{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .grad{color:#E2705A;-webkit-text-fill-color:#E2705A}
  .eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#E2705A;margin-bottom:14px}
  h1{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:12px}
  p{color:#9aa7b8;font-size:15px;line-height:1.55;margin-bottom:26px}
  .spin{width:26px;height:26px;border:3px solid rgba(200, 64, 44,.25);border-top-color:#e2705a;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 22px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .btn{display:inline-flex;align-items:center;gap:8px;background:#C8402C;color:#fff6f2;font-weight:700;font-size:15px;padding:13px 26px;border-radius:12px;text-decoration:none;transition:filter .15s}
  .btn:hover{filter:brightness(1.08)}
  .foot{margin-top:22px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#67748a}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="logo">
    <span class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><polygon points="12,3.4 19.6,7.8 12,12.2 4.4,7.8" fill="#24395A"/><polygon points="4.4,7.8 12,12.2 12,20.6 4.4,16.2" fill="#2F4A72"/><polygon points="19.6,7.8 12,12.2 12,20.6 19.6,16.2" fill="#1A2B45"/></svg></span>
    <span class="word">Container<span class="grad">Load</span></span>
  </div>
  <div class="eyebrow">● Geteilter Stauplan</div>
  <h1>Ein Ladeplan wurde<br>mit dir geteilt.</h1>
  <p>Du siehst gleich in 3D, wie die Ladung in den Container passt – interaktiv, ohne Login.</p>
  <div class="spin" id="spin"></div>
  <a class="btn" id="go" href="/app">Stauplan öffnen →</a>
  <div class="foot">containerload.io</div>
</div>
<script>
  (function () {
    var search = window.location.search || "";
    var target = "/app" + search;
    var go = document.getElementById("go");
    if (go) go.setAttribute("href", target);
    // give the branded screen a brief moment, then forward into the tool
    setTimeout(function () {
      try { window.location.replace(target); } catch (e) { window.location.href = target; }
    }, 450);
  })();
</script>
<noscript><div style="position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#9aa7b8;font-size:13px">Bitte JavaScript aktivieren oder den Button „Stauplan öffnen" klicken.</div></noscript>
</body>
</html>
